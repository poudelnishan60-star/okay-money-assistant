<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Unofficial prototype of an AI money assistant in a Khalti-style design. Not affiliated with Khalti. Mock data only.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="O-Kay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- O-Kay's server; the build fills it in (.github/workflows/pages.yml). -->
  <meta name="okay-api" content="__OKAY_API_BASE_URL__">
  <script>
    // Wake O-Kay's server the moment the page opens. The free server sleeps when nobody
    // uses it and takes up to a minute to wake; this starts that before Flutter has even
    // loaded. One empty request, nothing about the visitor.
    (function () {
      var api = document.querySelector('meta[name="okay-api"]').content;
      if (api.indexOf('http') !== 0) return; // a local build: no address filled in
      fetch(api.replace(/\/+$/, '') + '/health', { mode: 'no-cors', cache: 'no-store' })
        .catch(function () {});
    })();
  </script>

  <title>O-Kay · unofficial money-assistant prototype</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <style>
    body { background: #0A0A0A; margin: 0; }
    #okay-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #9E9E9E; font: 14px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="okay-loading">Loading O-Kay… (unofficial prototype)</div>
  <script>
    // Remove the loading note once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('okay-loading');
      if (el) el.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

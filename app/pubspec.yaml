name: khalti_ai_assistant
description: "O-Kay AI financial assistant prototype (Khalti). Mock data only."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The O-Kay mascot, cut from a screenshot of the Khalti app (tool/make_mascot.py).
  assets:
    - assets/okay/

  # Bundled so the site looks the same everywhere (SIL Open Font License; see assets/fonts/OFL-*.txt).
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600

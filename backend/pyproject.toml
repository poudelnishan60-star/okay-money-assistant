[project]
name = "khalti-ai-assistant-backend"
version = "0.1.0"
description = "Backend for the O-Kay AI financial assistant prototype (mock data only)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.6",
    "openai>=1.55",
    "nepali-datetime>=1.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests
"app/ai/prompt.py" = ["E501"]  # the prompt is prose; one rule per line reads best

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
